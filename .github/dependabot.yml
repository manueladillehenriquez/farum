# Escaneo de dependencias: Dependabot abre PRs con actualizaciones de
# seguridad y versiones nuevas. Revísalos y mergea (Vercel genera un preview
# de cada PR para probar antes de publicar).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Agrupa las actualizaciones menores/parches para no recibir 20 PRs.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
