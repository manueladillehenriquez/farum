name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo manualmente desde la pestaña "Actions" de GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos despliegues corran a la vez; si hay uno en curso y
# llega un push nuevo, se cancela el anterior y se usa el más reciente.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (export estático)
        run: npm run build
        env:
          # Prefijo que necesitan las imágenes de /public para cargar
          # bien bajo el subpath del repo (ver lib/site-config.ts). Debe
          # coincidir con el nombre del repo. Si más adelante conectas
          # un dominio propio, borra esta línea.
          NEXT_PUBLIC_BASE_PATH: /by-manoel

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
